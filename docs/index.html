<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}</style>
<title>Homelab de Antonio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Mapa interactivo del homelab: la red de casa, el servidor Proxmox y lo que se ejecuta dentro de cada equipo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap">
<style>
/* Plano de red: cabecera con migas y panel de puertos del lab, escenario SVG que hace zoom de equipo en equipo, fichas legibles debajo. */
:root{
  --bg:#ECEFF2;
  --paper:#F8FAFB;
  --ink:#121A23;
  --mute:#556171;
  --rule:#C5CDD6;
  --grid:#E1E6EB;
  --accent:#2446C4;
  --accent-soft:#DFE5FA;
  --ok:#15834A;
  --plan:#7F8A97;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"Martian Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1218; --paper:#131A22; --ink:#E2E7ED; --mute:#8E9AA9; --rule:#2A3441; --grid:#18202A;
    --accent:#8AA8FF; --accent-soft:#1C2848; --ok:#3BC977; --plan:#6F7A88; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1218; --paper:#131A22; --ink:#E2E7ED; --mute:#8E9AA9; --rule:#2A3441; --grid:#18202A;
  --accent:#8AA8FF; --accent-soft:#1C2848; --ok:#3BC977; --plan:#6F7A88; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabecera */
.top{display:flex;flex-wrap:wrap;gap:18px 40px;align-items:flex-end;justify-content:space-between}
.top>div{min-width:0;flex:1 1 420px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin:0 0 8px}
.crumbs{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.crumbs button{background:none;border:0;padding:2px 0;cursor:pointer;color:var(--accent);font:inherit;letter-spacing:inherit;text-transform:inherit}
.crumbs button:hover{text-decoration:underline}
.crumbs [aria-current]{color:var(--ink)}
h1{font-family:var(--display);font-stretch:116%;font-weight:640;font-size:clamp(26px,3.4vw,40px);line-height:1.08;letter-spacing:-.012em;margin:0;text-wrap:balance}
.lede{margin:10px 0 0;color:var(--mute);max-width:66ch;text-wrap:pretty}

.estado{display:grid;gap:8px;justify-items:start}
.estado h2{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin:0;font-weight:500}
.puertos{display:grid;grid-template-columns:repeat(17,12px);gap:5px 4px;padding:9px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
.puerto{width:12px;height:9px;border-radius:2px;border:1.5px solid var(--plan)}
.puerto.on{background:var(--ok);border-color:var(--ok)}
.cuenta{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--mute);margin:0}
.cuenta b{color:var(--ink);font-weight:600}
.interruptor{display:inline-flex;gap:10px;align-items:center;cursor:pointer;font-size:14px;user-select:none}
.interruptor input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:999px;border:1.5px solid var(--rule);background:var(--paper);position:relative;cursor:pointer;margin:0;flex:none;transition:background-color .15s,border-color .15s}
.interruptor input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--plan);transition:transform .18s}
.interruptor input:checked{background:var(--accent);border-color:var(--accent)}
.interruptor input:checked::after{transform:translateX(16px);background:var(--paper)}

/* Escenario */
.stage{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto;aspect-ratio:1200/680;max-height:74vh}
.aviso{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));margin:0;background:var(--paper);border:1.5px dashed var(--plan);border-radius:8px;padding:14px 16px;text-align:center;font-size:14px}

/* Mandos */
.mandos{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.btn{background:var(--paper);border:1px solid var(--rule);border-radius:7px;padding:7px 12px;cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.pestanas{position:relative;display:flex;gap:4px;overflow-x:auto;min-width:0;flex:1 1 320px;padding:2px}
.pestana{flex:0 0 auto;background:none;border:1px solid transparent;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px;display:inline-flex;gap:7px;align-items:center;color:var(--mute);white-space:nowrap}
.pestana:hover{color:var(--ink);border-color:var(--rule)}
.pestana[aria-current="true"]{color:var(--ink);border-color:var(--ink);background:var(--paper)}
.lado{display:flex;gap:8px}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--plan);flex:none}
.led.on{background:var(--ok);border-color:var(--ok)}

.leyenda{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--mute);align-items:center;margin:0;padding:0;list-style:none}
.leyenda li{display:inline-flex;gap:8px;align-items:center}
.leyenda svg{width:34px;height:10px;overflow:visible;flex:none}
.leyenda b{color:var(--accent);font-family:var(--mono)}

/* Fichas */
.fichas-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin:10px 0 10px}
.fichas-cab h2{font-size:17px;font-stretch:108%;font-weight:620;margin:0}
.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,262px),1fr));gap:12px;margin:0;padding:0;list-style:none}
.ficha{background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:13px 15px 14px;display:grid;gap:6px;align-content:start;min-width:0;transition:border-color .2s,box-shadow .2s}
.ficha.plan{border-style:dashed;border-color:var(--plan)}
.ficha.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ficha header{display:flex;gap:9px;align-items:center}
.ficha h3{font-size:15px;font-weight:620;margin:0;min-width:0;flex:1;line-height:1.25}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--ok);color:var(--ok);white-space:nowrap}
.chip.p{border-color:var(--plan);color:var(--mute);border-style:dashed}
.tag{font-family:var(--mono);font-stretch:90%;font-size:11.5px;color:var(--mute);margin:0;overflow-wrap:anywhere}
.ficha ul{margin:2px 0 0;padding-left:17px;font-size:13.5px;display:grid;gap:3px}
.entrar{justify-self:start;margin-top:4px;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13.5px;font-weight:560}
.entrar:hover{text-decoration:underline}
.pie{font-size:12.5px;color:var(--mute);margin:8px 0 0}

/* Dibujo SVG */
.layer{transform-box:view-box}
.zone rect{fill:none;stroke:var(--rule);stroke-width:1.5}
.zone.fuera rect{stroke-dasharray:1 6;stroke-linecap:round;stroke-width:2}
.zone.aislada rect{stroke:var(--ink);stroke-opacity:.45;stroke-dasharray:2 5;stroke-linecap:round}
.zone.plan rect{stroke-dasharray:8 6}
.zone text{font-family:var(--mono);font-size:11.5px;letter-spacing:1.4px;fill:var(--mute)}
.node .caja{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
.node.plan .caja{stroke:var(--plan);stroke-dasharray:6 5}
.node.ref .caja{stroke:var(--rule);stroke-dasharray:2 4;stroke-width:1.4}
.node .ico{color:var(--ink)}
.node.plan .ico,.node.ref .ico,.node.nube .ico{color:var(--mute)}
.node .nom{font-family:var(--display);font-weight:620;fill:var(--ink)}
.node.plan .nom,.node.ref .nom{fill:var(--mute)}
.node .tg{font-family:var(--mono);font-stretch:87.5%;fill:var(--mute)}
.node .sb{font-family:var(--display);fill:var(--mute)}
.node .ledsvg{fill:var(--ok);stroke:var(--ok);stroke-width:1.5}
.node.plan .ledsvg{fill:none;stroke:var(--plan)}
.node .flecha{fill:var(--accent);font-family:var(--mono);font-size:17px;font-weight:600}
.node.go{cursor:pointer}
.node.go:focus{outline:none}
.node.go:hover .caja,.node.go:focus-visible .caja{stroke:var(--accent);fill:var(--accent-soft)}
.node.go:focus-visible .caja{stroke-width:2.8}
.node.hl .caja{stroke:var(--accent);stroke-width:2.6}
.ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.ln.plan{stroke:var(--plan);stroke-dasharray:7 6}
.lnlab{font-family:var(--mono);font-stretch:87.5%;font-size:12px;fill:var(--mute);paint-order:stroke;stroke:var(--paper);stroke-width:7px;stroke-linejoin:round}
.bus{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.bus.plan{stroke:var(--plan);stroke-dasharray:14 9;stroke-linecap:butt}
.buslab{font-family:var(--mono);font-size:12.5px;fill:var(--ink)}
.buslab.plan{fill:var(--mute)}
.flow{fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:.1 16;animation:flujo 1.1s linear infinite}
.flow.plan{stroke:var(--plan)}
@keyframes flujo{to{stroke-dashoffset:-16.1}}
.nota .rayita{stroke:var(--accent);stroke-width:2}
.nota text{font-family:var(--display);font-size:14px;fill:var(--ink)}
.nota .nt-t{font-weight:650}
.muro rect{fill:url(#rayado);stroke:var(--ink);stroke-width:1.2;stroke-opacity:.6}
.muro text{font-family:var(--mono);font-size:11.5px;fill:var(--mute)}

/* Solo lo que funciona hoy */
body.solo-real .plan{display:none!important}

@media (prefers-reduced-motion: reduce){
  .flow{animation:none;stroke-dasharray:none;opacity:.35}
  .interruptor input,.interruptor input::after,.ficha{transition:none}
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow"><span>Homelab</span><span aria-hidden="true">/</span><nav class="crumbs" id="migas" aria-label="Ruta"></nav></div>
      <h1 id="titulo">La red de casa</h1>
      <p class="lede" id="sub"></p>
    </div>
    <section class="estado" aria-labelledby="estado-t">
      <h2 id="estado-t">Estado del lab</h2>
      <div class="puertos" id="puertos" role="img"></div>
      <p class="cuenta" id="cuenta"></p>
      <label class="interruptor" for="ver-plan"><input type="checkbox" id="ver-plan" checked> Mostrar lo planificado</label>
    </section>
  </header>

  <div class="stage">
    <svg id="lienzo" viewBox="0 0 1200 680" role="group" aria-label="Diagrama del homelab">
      <defs id="defs"></defs>
      <rect width="1200" height="680" fill="url(#cuadricula)"/>
      <g id="capas"></g>
    </svg>
    <p class="aviso" id="aviso" hidden>Esta parte todavía no está montada. Activa «Mostrar lo planificado» para ver cómo será.</p>
  </div>

  <div class="mandos">
    <button class="btn" id="atras" type="button">← <span id="atras-txt">Vista general</span></button>
    <nav class="pestanas" id="pestanas" aria-label="Vistas"></nav>
    <div class="lado">
      <button class="btn" id="ant" type="button" aria-label="Vista anterior">←</button>
      <button class="btn" id="sig" type="button">Siguiente →</button>
    </div>
  </div>

  <ul class="leyenda">
    <li><svg viewBox="0 0 34 10" aria-hidden="true"><line x1="0" y1="5" x2="34" y2="5" style="stroke:var(--ink)" stroke-width="2"/></svg>Funciona hoy</li>
    <li><svg viewBox="0 0 34 10" aria-hidden="true"><line x1="0" y1="5" x2="34" y2="5" style="stroke:var(--plan)" stroke-width="2" stroke-dasharray="7 6"/></svg>Planificado</li>
    <li><span class="led on"></span>Pieza en marcha</li>
    <li><span class="led"></span>Pieza por montar</li>
    <li>Pulsa un equipo con <b>›</b> para ver qué tiene dentro</li>
  </ul>

  <section aria-labelledby="fichas-t">
    <div class="fichas-cab"><h2 id="fichas-t">Piezas de esta vista</h2><span class="cuenta" id="fichas-n"></span></div>
    <ul class="fichas" id="fichas"></ul>
  </section>

  <p class="pie" id="pie"></p>
</div>

      return { d: `M${a.x} ${y1}V${my}H${b.x}V${y2}`, m: [(a.x + b.x) / 2, my] };
    }
    const s = Math.sign(dx) || 1, x1 = a.x + s * a.w / 2, x2 = b.x - s * b.w / 2;
    if (Math.abs(dy) < 1) return { d: `M${x1} ${a.y}H${x2}`, m: [(x1 + x2) / 2, a.y] };
    const mx = (x1 + x2) / 2;
    return { d: `M${x1} ${a.y}H${mx}V${b.y}H${x2}`, m: [mx, (a.y + b.y) / 2] };
  }

  function nodo(n, parent) {
    const go = !!n.entra;
    const g = el("g", {
      class: cls("node", n.ref && "ref", n.tipo === "nube" && "nube", esPlan(n) && "plan", go && "go"),
      "data-id": n.id, transform: `translate(${n.x} ${n.y})`
    }, parent);
    if (go) {
      g.setAttribute("tabindex", "0");
      g.setAttribute("role", "button");
      g.setAttribute("aria-label", `Ir a ${ESC[n.entra] ? ESC[n.entra].nombre : n.nombre}`);
      g.dataset.entra = n.entra;
    }
    if (n.tipo === "nube") {
      el("use", { href: "#i-cloud", class: "ico", x: -28, y: -42, width: 56, height: 56 }, g);
      el("text", { class: "nom", x: 0, y: 30, "text-anchor": "middle", "font-size": 15 }, g, n.nombre);
      return g;
    }
    const W = n.w, H = n.h, x0 = -W / 2, max = W - 78;
    el("rect", { class: "caja", x: x0, y: -H / 2, width: W, height: H, rx: 8 }, g);
    el("use", { href: `#i-${n.icono}`, class: "ico", x: x0 + 12, y: -15, width: 30, height: 30 }, g);
    const filas = [["nom", n.nombre, 15]];
    if (n.tag) filas.push(["tg", n.tag, 11.5]);
    if (n.sub) filas.push(["sb", n.sub, 12.5]);
    const base = { 1: [5], 2: [-3, 14], 3: [-11, 6, 23] }[filas.length];
    filas.forEach(([c, t, fs], i) => el("text", { class: c, x: x0 + 52, y: base[i], "font-size": fs, "data-max": max }, g, t));
    if (!n.ref) el("circle", { class: "ledsvg", cx: W / 2 - 14, cy: -H / 2 + 14, r: 5 }, g);
    if (go) el("text", { class: "flecha", x: W / 2 - 14, y: H / 2 - 9, "text-anchor": "middle" }, g, "›");
    return g;
  }

  function nota(nt, parent) {
    const g = el("g", { class: cls("nota", esPlan(nt) && "plan") }, parent);
    const filas = (nt.titulo ? [nt.titulo] : []).concat(nt.lineas || []);
    el("line", { class: "rayita", x1: nt.x, y1: nt.y - 13, x2: nt.x, y2: nt.y - 13 + filas.length * 18 + 1 }, g);
    const t = el("text", { x: nt.x + 12, y: nt.y }, g);
    filas.forEach((f, i) => el("tspan", { x: nt.x + 12, dy: i ? 18 : 0, class: i === 0 && nt.titulo ? "nt-t" : null }, t, f));
  }

  function dibujar(esc) {
    const g = el("g", { class: "layer", "data-id": esc.id, hidden: "" }, $("capas"));
    const porId = {};
    esc.nodos.forEach(n => { porId[n.id] = n; });
    (esc.zonas || []).forEach(z => {
      const zg = el("g", { class: cls("zone", z.estilo, esPlan(z) && "plan") }, g);
      el("rect", { x: z.x, y: z.y, width: z.w, height: z.h, rx: 14 }, zg);
      el("text", { x: z.x + 16, y: z.y + 24 }, zg, z.etiqueta.toUpperCase());
    });
    (esc.muros || []).forEach(m => {
      const mg = el("g", { class: cls("muro", esPlan(m) && "plan") }, g);
      el("rect", { x: m.x - 8, y: m.y1, width: 16, height: m.y2 - m.y1, rx: 3 }, mg);
      el("text", { x: m.x, y: m.y2 + 18, "text-anchor": "middle" }, mg, m.etiqueta);
    });
    esc.nodos.filter(n => n.tipo === "bus").forEach(b => {
      el("line", { class: cls("bus", esPlan(b) && "plan"), x1: b.x1, y1: b.y, x2: b.x2, y2: b.y }, g);
      el("text", { class: cls("buslab", esPlan(b) && "plan"), x: b.x1, y: b.y - 14 }, g, b.nombre);
    });
    const gl = el("g", null, g), gf = el("g", null, g), ge = el("g", null, g);
    (esc.enlaces || []).forEach(l => {
      const a = porId[l.de], b = porId[l.a];
      if (!a || !b) return;
      const r = ruta(a, b, l), p = esPlan(l);
      el("path", { class: cls("ln", p && "plan"), d: r.d }, gl);
      if (l.flujo) el("path", { class: cls("flow", p && "plan"), d: r.d }, gf);
      if (l.etiqueta) el("text", { class: cls("lnlab", p && "plan"), x: r.m[0], y: r.m[1] + 4, "text-anchor": "middle" }, ge, l.etiqueta);
    });
    esc.nodos.filter(n => n.tipo !== "bus").forEach(n => nodo(n, g));
    (esc.notas || []).forEach(nt => nota(nt, g));
    return g;
  }

  const capas = {};
  LAB.escenas.forEach(e => { capas[e.id] = dibujar(e); });

  /* Encoge el texto que no cabe en su caja */
  function ajustar(L) {
    L.querySelectorAll("text[data-max]").forEach(t => {
      const max = +t.dataset.max;
      let fs = +(t.dataset.fs || t.getAttribute("font-size"));
      t.dataset.fs = fs;
      t.setAttribute("font-size", fs);
      try {
        let i = 0;
        while (t.getComputedTextLength() > max && fs > 9 && i++ < 24) { fs -= 0.5; t.setAttribute("font-size", fs); }
      } catch (e) { /* sin medida disponible */ }
    });
  }

  /* Panel de puertos: una luz por pieza */
  const piezas = new Map();
  LAB.escenas.forEach(e => e.nodos.concat(e.extras || []).forEach(n => {
    if (n.ref || n.tipo === "nube" || n.cuenta === false || piezas.has(n.id)) return;
    piezas.set(n.id, n);
  }));
  const todas = [...piezas.values()];
  const nOk = todas.filter(n => !esPlan(n)).length, nPlan = todas.length - nOk;
  todas.sort((a, b) => esPlan(a) - esPlan(b)).forEach(n => {
    const s = document.createElement("span");
    s.className = "puerto" + (esPlan(n) ? "" : " on");
    s.title = `${n.nombre}: ${esPlan(n) ? "planificado" : "en marcha"}`;
    $("puertos").appendChild(s);
  });
  $("puertos").setAttribute("aria-label", `${nOk} piezas en marcha y ${nPlan} planificadas`);
  $("cuenta").innerHTML = `<b>${nOk}</b> en marcha · <b>${nPlan}</b> planificadas`;
  $("pie").textContent = `Actualizado el ${LAB.actualizado}. Lo dibujado en discontinuo todavía no está montado: cuando funcione, pasa a línea continua.`;

  /* Pestañas */
  const pest = $("pestanas");
  LAB.escenas.forEach(e => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pestana" + (esPlan(e) ? " plan" : "");
    b.dataset.id = e.id;
    b.innerHTML = `<span class="led${esPlan(e) ? "" : " on"}"></span>`;
    b.append(e.nombre);
    b.addEventListener("click", () => ir(e.id));
    pest.appendChild(b);
  });

  /* Estado */
  let actual = null, enCurso = [], verPlan = true;
  try { if (localStorage.getItem("homelab-ver-plan") === "0") verPlan = false; } catch (e) { /* sin almacenamiento */ }
  const chk = $("ver-plan");
  chk.checked = verPlan;
  document.body.classList.toggle("solo-real", !verPlan);
  chk.addEventListener("change", () => {
    verPlan = chk.checked;
    document.body.classList.toggle("solo-real", !verPlan);
    try { localStorage.setItem("homelab-ver-plan", verPlan ? "1" : "0"); } catch (e) { /* sin almacenamiento */ }
    if (actual) { ajustar(capas[actual]); interfaz(ESC[actual]); }
  });

  function marcar(id, on) {
    if (!actual) return;
    capas[actual].querySelectorAll(`.node[data-id="${id}"]`).forEach(n => n.classList.toggle("hl", on));
  }
  function destacarFicha(id) {
    const li = $("fichas").querySelector(`.ficha[data-id="${id}"]`);
    if (!li) return;
    li.classList.add("hl");
    li.scrollIntoView({ block: "nearest", behavior: reducido() ? "auto" : "smooth" });
    setTimeout(() => li.classList.remove("hl"), 1400);
  }

  function pintarFichas(esc) {
    const ul = $("fichas");
    ul.textContent = "";
    const items = esc.nodos.filter(n => !n.ref && n.tipo !== "nube").concat(esc.extras || []);
    let vis = 0;
    items.forEach(n => {
      const p = esPlan(n);
      if (!p || verPlan) vis++;
      const li = document.createElement("li");
      li.className = "ficha" + (p ? " plan" : "");
      li.dataset.id = n.id;
      const h = document.createElement("header");
      h.innerHTML = `<span class="led${p ? "" : " on"}"></span>`;
      const h3 = document.createElement("h3");
      h3.textContent = n.nombre;
      const chip = document.createElement("span");
      chip.className = "chip" + (p ? " p" : "");
      chip.textContent = p ? "Planificado" : "En marcha";
      h.append(h3, chip);
      li.appendChild(h);
      if (n.tag) {
        const t = document.createElement("p");
        t.className = "tag";
        t.textContent = n.tag;
        li.appendChild(t);
      }
      const lineas = n.fic || (n.sub ? [n.sub] : []);
      if (lineas.length) {
        const lu = document.createElement("ul");
        lineas.forEach(x => { const i = document.createElement("li"); i.textContent = x; lu.appendChild(i); });
        li.appendChild(lu);
      }
      if (n.entra && ESC[n.entra] && n.entra !== esc.id) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "entrar";
        b.textContent = `Ir a ${ESC[n.entra].nombre} →`;
        b.addEventListener("click", () => ir(n.entra));
        li.appendChild(b);
      }
      li.addEventListener("mouseenter", () => marcar(n.id, true));
      li.addEventListener("mouseleave", () => marcar(n.id, false));
      ul.appendChild(li);
    });
    $("fichas-n").textContent = `${vis} ${vis === 1 ? "pieza" : "piezas"}`;
  }

  function visibles() {
    return ORDEN.filter(i => verPlan || !esPlan(ESC[i]) || i === actual);
  }

  function interfaz(esc) {
    $("titulo").textContent = esc.titulo;
    $("sub").textContent = esc.sub;
    const cadena = [];
    for (let e = esc; e; e = e.padre ? ESC[e.padre] : null) cadena.unshift(e);
    const migas = $("migas");
    migas.textContent = "";
    cadena.forEach((e, i) => {
      if (i) { const s = document.createElement("span"); s.setAttribute("aria-hidden", "true"); s.textContent = "›"; migas.appendChild(s); }
      if (i === cadena.length - 1) {
        const s = document.createElement("span");
        s.setAttribute("aria-current", "page");
        s.textContent = e.nombre;
        migas.appendChild(s);
      } else {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = e.nombre;
        b.addEventListener("click", () => ir(e.id));
        migas.appendChild(b);
      }
    });
    pest.querySelectorAll(".pestana").forEach(b => b.setAttribute("aria-current", b.dataset.id === esc.id ? "true" : "false"));
    const activa = pest.querySelector(`[data-id="${esc.id}"]`);
    if (activa && pest.scrollWidth > pest.clientWidth) {
      const left = activa.offsetLeft - (pest.clientWidth - activa.offsetWidth) / 2;
      try { pest.scrollTo({ left, behavior: reducido() ? "auto" : "smooth" }); } catch (e) { pest.scrollLeft = left; }
    }
    if (esc.padre) { $("atras").disabled = false; $("atras-txt").textContent = `Volver a ${ESC[esc.padre].nombre}`; }
    else { $("atras").disabled = true; $("atras-txt").textContent = "Vista general"; }
    const v = visibles(), k = v.indexOf(esc.id);
    $("ant").disabled = k <= 0;
    $("sig").disabled = k >= v.length - 1;
    $("aviso").hidden = verPlan || !esPlan(esc);
    pintarFichas(esc);
  }

  function puerta(esc, hijo) {
    const n = esc.nodos.find(x => x.entra === hijo && !x.ref) || esc.nodos.find(x => x.entra === hijo);
    return n ? [n.x, n.y] : [600, 340];
  }

  function mostrar(id, inicial) {
    const to = ESC[id];
    if (!to || id === actual) return;
    /* Cancelar (no terminar): terminar una animación ya cancelada la reactiva
       con fill "forwards" y deja la capa invisible. */
    enCurso.forEach(a => { try { a.cancel(); } catch (e) { /* ya cancelada */ } });
    enCurso = [];
    for (const k in capas) if (k !== id && k !== actual) capas[k].setAttribute("hidden", "");
    const from = actual ? ESC[actual] : null;
    const Lto = capas[id], Lfrom = from ? capas[from.id] : null;
    actual = id;
    Lto.removeAttribute("hidden");
    ajustar(Lto);
    interfaz(to);
    if (!Lfrom) return;
    const ocultar = () => { if (actual !== from.id) Lfrom.setAttribute("hidden", ""); };
    if (inicial || reducido() || !Lfrom.animate) { ocultar(); return; }
    let modo = "fundido", o = [600, 340];
    if (to.padre === from.id) { modo = "dentro"; o = puerta(from, to.id); }
    else if (from.padre === to.id) { modo = "fuera"; o = puerta(to, from.id); }
    const origen = `${o[0]}px ${o[1]}px`;
    Lfrom.style.transformOrigin = origen;
    Lto.style.transformOrigin = origen;
    const G = 2.6, P = 0.3;
    const K = {
      dentro: [[{ transform: "scale(1)", opacity: 1 }, { transform: `scale(${G})`, opacity: 0 }],
               [{ transform: `scale(${P})`, opacity: 0 }, { transform: "scale(1)", opacity: 1 }]],
      fuera: [[{ transform: "scale(1)", opacity: 1 }, { transform: `scale(${P})`, opacity: 0 }],
              [{ transform: `scale(${G})`, opacity: 0 }, { transform: "scale(1)", opacity: 1 }]],
      fundido: [[{ transform: "translateY(0px)", opacity: 1 }, { transform: "translateY(-12px)", opacity: 0 }],
                [{ transform: "translateY(12px)", opacity: 0 }, { transform: "translateY(0px)", opacity: 1 }]]
    }[modo];
    const a1 = Lfrom.animate(K[0], { duration: 480, easing: "cubic-bezier(.55,0,.8,.2)", fill: "forwards" });
    const a2 = Lto.animate(K[1], { duration: 620, delay: 80, easing: "cubic-bezier(.15,.8,.25,1)", fill: "backwards" });
    enCurso = [a1, a2];
    a1.finished.catch(() => {}).then(() => { ocultar(); a1.cancel(); });
  }

  function ir(id) {
    if (!ESC[id] || id === actual) return;
    try { if (location.hash !== "#" + id) location.hash = id; } catch (e) { /* sin hash */ }
    mostrar(id);
  }
  function mover(d) {
    const v = visibles(), k = v.indexOf(actual), dest = v[k + d];
    if (dest) ir(dest);
  }

  window.addEventListener("hashchange", () => {
    const id = decodeURIComponent(location.hash.slice(1));
    if (ESC[id]) mostrar(id);
  });
  $("atras").addEventListener("click", () => { const p = actual && ESC[actual].padre; if (p) ir(p); });
  $("ant").addEventListener("click", () => mover(-1));
  $("sig").addEventListener("click", () => mover(1));

  const svg = $("lienzo");
  svg.addEventListener("click", ev => {
    const n = ev.target.closest && ev.target.closest(".node");
    if (!n) return;
    if (n.dataset.entra) ir(n.dataset.entra);
    else destacarFicha(n.dataset.id);
  });
  svg.addEventListener("keydown", ev => {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    const n = ev.target.closest && ev.target.closest(".node.go");
    if (!n) return;
    ev.preventDefault();
    ir(n.dataset.entra);
  });
  document.addEventListener("keydown", ev => {
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    if (ev.target.closest && ev.target.closest("input, textarea, select")) return;
    if (ev.key === "ArrowRight") mover(1);
    else if (ev.key === "ArrowLeft") mover(-1);
    else if (ev.key === "Escape" && actual && ESC[actual].padre) ir(ESC[actual].padre);
  });

  const inicial = decodeURIComponent(location.hash.slice(1));
  mostrar(ESC[inicial] ? inicial : "casa", true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (actual) ajustar(capas[actual]); });
})();
</script>
</html>
